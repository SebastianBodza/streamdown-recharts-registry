<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="Streamdown Recharts — recharts-json code fences rendered as live charts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <rect width="640" height="280" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="639" height="279" rx="13.5" fill="none" stroke="#30363d"/>

  <!-- header -->
  <circle cx="28" cy="30" r="5" fill="#ff5f56"/>
  <circle cx="46" cy="30" r="5" fill="#ffbd2e"/>
  <circle cx="64" cy="30" r="5" fill="#27c93f"/>
  <text x="92" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">```recharts-json</text>

  <text x="28" y="78" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" fill="#e6edf3">Streamdown Recharts</text>
  <text x="28" y="100" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#8b949e">LLM JSON fences → live bar, line, area, pie &amp; scatter charts</text>

  <!-- chart area -->
  <g transform="translate(28,128)">
    <!-- gridlines -->
    <g stroke="#21262d" stroke-width="1">
      <line x1="0" y1="0" x2="584" y2="0"/>
      <line x1="0" y1="30" x2="584" y2="30"/>
      <line x1="0" y1="60" x2="584" y2="60"/>
      <line x1="0" y1="90" x2="584" y2="90"/>
    </g>
    <!-- axis -->
    <line x1="0" y1="0" x2="0" y2="110" stroke="#30363d" stroke-width="1.5"/>
    <line x1="0" y1="110" x2="584" y2="110" stroke="#30363d" stroke-width="1.5"/>

    <!-- bars -->
    <g fill="url(#bar)">
      <rect x="40"  y="58" width="44" height="52" rx="3"/>
      <rect x="130" y="40" width="44" height="70" rx="3"/>
      <rect x="220" y="70" width="44" height="40" rx="3"/>
      <rect x="310" y="22" width="44" height="88" rx="3"/>
      <rect x="400" y="48" width="44" height="62" rx="3"/>
      <rect x="490" y="34" width="44" height="76" rx="3"/>
    </g>

    <!-- trend line -->
    <polyline points="62,50 152,30 242,62 332,14 422,40 512,24"
      fill="none" stroke="#a3e635" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#a3e635">
      <circle cx="62" cy="50" r="3.2"/>
      <circle cx="152" cy="30" r="3.2"/>
      <circle cx="242" cy="62" r="3.2"/>
      <circle cx="332" cy="14" r="3.2"/>
      <circle cx="422" cy="40" r="3.2"/>
      <circle cx="512" cy="24" r="3.2"/>
    </g>

    <!-- x labels -->
    <g font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#6e7681" text-anchor="middle">
      <text x="62"  y="126">Jan</text>
      <text x="152" y="126">Feb</text>
      <text x="242" y="126">Mar</text>
      <text x="332" y="126">Apr</text>
      <text x="422" y="126">May</text>
      <text x="512" y="126">Jun</text>
    </g>
  </g>

  <!-- legend -->
  <g transform="translate(440,86)" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="11" fill="#8b949e">
    <rect x="0" y="-9" width="12" height="12" rx="2" fill="url(#bar)"/>
    <text x="18" y="1">Revenue</text>
    <rect x="92" y="-3" width="12" height="3" rx="1.5" fill="#a3e635"/>
    <text x="110" y="1">Trend</text>
  </g>
</svg>
