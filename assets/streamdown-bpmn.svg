<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="Streamdown BPMN — bpmn code fences rendered as interactive BPMN 2.0 diagrams">
  <defs>
    <linearGradient id="bgb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <rect width="640" height="280" rx="14" fill="url(#bgb)"/>
  <rect x="0.5" y="0.5" width="639" height="279" rx="13.5" fill="none" stroke="#30363d"/>

  <!-- header -->
  <circle cx="28" cy="30" r="5" fill="#ff5f56"/>
  <circle cx="46" cy="30" r="5" fill="#ffbd2e"/>
  <circle cx="64" cy="30" r="5" fill="#27c93f"/>
  <text x="92" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#8b949e">```bpmn</text>

  <text x="28" y="78" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="700" fill="#e6edf3">Streamdown BPMN</text>
  <text x="28" y="100" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#8b949e">LLM BPMN 2.0 XML → interactive, zoomable process diagrams</text>

  <!-- diagram -->
  <g transform="translate(0,40)">
    <!-- connectors -->
    <g stroke="#8b949e" stroke-width="1.6" fill="none">
      <line x1="74"  y1="150" x2="118" y2="150" marker-end="url(#arrow)"/>
      <line x1="226" y1="150" x2="276" y2="150" marker-end="url(#arrow)"/>
      <!-- gateway up branch -->
      <path d="M312 124 L312 96 L356 96" marker-end="url(#arrow)"/>
      <!-- gateway down branch -->
      <path d="M312 176 L312 204 L356 204" marker-end="url(#arrow)"/>
      <line x1="464" y1="96" x2="508" y2="96" marker-end="url(#arrow)"/>
    </g>

    <!-- start event -->
    <circle cx="56" cy="150" r="18" fill="#0d9488" fill-opacity="0.15" stroke="#2dd4bf" stroke-width="2"/>

    <!-- task: Review -->
    <rect x="118" y="128" width="108" height="44" rx="8" fill="#0d9488" fill-opacity="0.12" stroke="#2dd4bf" stroke-width="1.8"/>
    <text x="172" y="155" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#e6edf3">Review</text>

    <!-- gateway (diamond) -->
    <rect x="294" y="132" width="36" height="36" rx="4" transform="rotate(45 312 150)" fill="#a3e635" fill-opacity="0.14" stroke="#a3e635" stroke-width="1.8"/>
    <text x="312" y="154" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="16" fill="#a3e635">?</text>

    <!-- task: Approve (up) -->
    <rect x="356" y="74" width="108" height="44" rx="8" fill="#0d9488" fill-opacity="0.12" stroke="#2dd4bf" stroke-width="1.8"/>
    <text x="410" y="101" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#e6edf3">Approve</text>

    <!-- task: Reject (down) -->
    <rect x="356" y="182" width="108" height="44" rx="8" fill="#0d9488" fill-opacity="0.12" stroke="#2dd4bf" stroke-width="1.8"/>
    <text x="410" y="209" text-anchor="middle" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="12.5" fill="#e6edf3">Reject</text>

    <!-- end event -->
    <circle cx="526" cy="96" r="18" fill="none" stroke="#a3e635" stroke-width="3"/>
  </g>

  <!-- toolbar hint -->
  <g transform="translate(556,222)" fill="#6e7681">
    <rect x="0" y="0" width="56" height="22" rx="6" fill="#21262d" stroke="#30363d"/>
    <circle cx="14" cy="11" r="2.4"/>
    <circle cx="28" cy="11" r="2.4"/>
    <circle cx="42" cy="11" r="2.4"/>
  </g>
</svg>
